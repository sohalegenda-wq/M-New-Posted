name: Cloudflare Workers Free
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.ENABLE_CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/configure-d1.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run db:local
      - run: npm run test:e2e
        env:
          CI: true
      - name: Apply production migrations
        run: npm run db:remote
      - name: Deploy worker and static assets
        run: npx wrangler deploy
